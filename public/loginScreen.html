<!DOCTYPE html>
<html lang="en">
<head>
  <title>UtiliSee Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-container">
    <img src="images/logo.png" alt="UtiliSee Logo" class="logo">
    <p>Log into your UtiliSee Account</p>

    <!-- Login form for existing users -->
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <!-- Displays login success or error messages -->
    <p id="login-message"></p>

    <!-- Link to the account creation page -->
    <p class="create-account">
      <a href="createAccount.html">Create New Account</a>
    </p>
    
  </div>

  <script src="app.js"></script>

</body>
</html>
