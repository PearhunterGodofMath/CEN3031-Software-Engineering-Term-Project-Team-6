<!DOCTYPE html>
<html lang="en">
<head>
  <title>UtiliSee Change Password</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-container">
    <img src="images/logo.png" alt="UtiliSee Logo" class="logo">
    <p>Change Password</p>

    <!-- Form for updating the user's account password -->
    <form id="change-password-form">
      <input 
        type="password" 
        id="current-password" 
        placeholder="Current Password" 
        required 
      />

      <input 
        type="password" 
        id="new-password" 
        placeholder="New Password" 
        required 
      />

      <input 
        type="password" 
        id="confirm-new-password" 
        placeholder="Confirm New Password" 
        required 
      />

      <button type="submit">Change Password</button>
    </form>

    <!-- Displays success or error messages after attempting a password change -->
    <p id="change-password-message" class="settings-message"></p>

    <!-- Link back to the account settings page -->
    <p class="create-account">
      <a href="accountSettings.html">Back to Settings</a>
    </p>

  </div>

  <script src="app.js"></script>

</body>
</html>
