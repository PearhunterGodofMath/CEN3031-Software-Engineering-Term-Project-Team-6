<!DOCTYPE html>
<html lang="en">
<head>
  <title>UtiliSee Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-container">
    <img src="images/logo.png" alt="UtiliSee Logo" class="logo">
    <p>Account Settings</p>

    <!-- Navigation buttons for account management actions -->
    <div class="settings-buttons">
      <button type="button" onclick="window.location.href='utilitiesTable.html'">
        Back to Utilities
      </button>

      <button type="button" class="change-password-button" onclick="window.location.href='changePassword.html'">
        Change Password
      </button>

      <button type="button" class="delete-account-button" id="delete-account-button">
        Delete Account
      </button>

      <button type="button" class="logout-button" onclick="window.location.href='loginScreen.html'">
        Log Out
      </button>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
