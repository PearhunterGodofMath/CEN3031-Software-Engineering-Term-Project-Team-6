<!DOCTYPE html>
<html>
<head>
  <title>UtiliSee Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-container">
    <img src="images/logo.png" alt="UtiliSee Logo" class="logo">
    <p>Account Settings</p>

    <div class="settings-buttons">
      <button type="button" onclick="window.location.href='utilitiesTable.html'">
        Back to Utilities
      </button>
      <button type="button" id="change-password-button">

      </button>
      <button type="button" id="delete-account-button">

      <button type="button" onclick="window.location.href='loginScreen.html'">
        Log Out
      </button>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
